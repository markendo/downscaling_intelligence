[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "llava"
version = "1.7.0.dev0"

dependencies = [
    "llava[standalone]",
    "fastapi",
    "markdown2[all]",
    "requests",
    "sentencepiece",
    "uvicorn",
    "wandb",
    "hf_transfer",
    "av",
    "decord",
    "tyro",
    "pytablewriter",
    "sacrebleu",
    "openai",
    "loguru",
    "evaluate",
    "sqlitedict",
    "tenacity",
    "einops",
    "qwen-vl-utils",
  ]

[project.optional-dependencies]
hf = [
    "numpy==1.26.1",
    "torch==2.6.0",
    "torchvision==0.21.0",
    "transformers==4.53.0",
    "accelerate==1.10.0",
    "tokenizers==0.21.4",
    "datasets==2.16.1",
    "pydantic==1.10.8",
    "timm==1.0.19",
    "open_clip_torch",
    "deepspeed==0.14.4",
    "peft==0.4.0",
    "bitsandbytes==0.45.1",
    "scikit-learn==1.2.2",
    "einops-exts==0.0.4",
    "gradio_client==0.2.9",
    "urllib3==1.26.20",
    "opencv-python==4.11.0.86",
    "scipy==1.15.3",
]

vllm = [
    "numpy==2.2.6",
    "torch==2.9.1",
    "torchvision==0.24.1",
    "torchaudio==2.9.1",
    "transformers==4.57.3",
    "accelerate==1.0.1",
    "tokenizers==0.22.2",
    "datasets==4.5.0",
    "pydantic==2.12.5",
    "timm==1.0.24",
    "vllm==0.14.1",
    "ray==2.53.0",
    "compressed-tensors==0.13.0",
    "xgrammar==0.1.29",
    "opencv-python-headless==4.13.0.90",
]

[tool.setuptools.packages.find]
include = ["llava*", "trl*"]
exclude = [
    "assets*",
    "benchmark*",
    "docs",
    "dist*",
    "playground*",
    "scripts*",
    "tests*",
    "checkpoints*",
    "project_checkpoints*",
    "debug_checkpoints*",
    "mlx_configs*",
    "wandb*",
    "notebooks*",
]

[tool.wheel]
exclude = [
    "assets*",
    "benchmark*",
    "docs",
    "dist*",
    "playground*",
    "scripts*",
    "tests*",
    "checkpoints*",
    "project_checkpoints*",
    "debug_checkpoints*",
    "mlx_configs*",
    "wandb*",
    "notebooks*",
]
